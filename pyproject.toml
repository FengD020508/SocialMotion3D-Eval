[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "socialmotion3d-eval"
version = "0.1.0"
description = "Controlled E2a and E3 evaluation for IDD-PeD camera and human motion reconstructions"
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib", "torch"]

[tool.setuptools.packages.find]
where = ["src"]

